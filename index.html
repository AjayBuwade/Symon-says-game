<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symon Says Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center mt-5">
    <div class="card p-4 shadow-lg rounded-4" id="game-card">
      <h1 class="mb-3">Symon Says Game</h1>
      <h4 id="level-title" class="mb-3">Press Start to Play</h4>
      
      <!-- Controls -->
      <div class="d-flex justify-content-center gap-2 mb-3">
        <button id="startBtn" class="btn btn-primary btn-lg rounded-pill shadow">Start Game</button>
        <button id="toggleTheme" class="btn btn-outline-light btn-lg rounded-pill shadow">Light Mode</button>
      </div>
      
      <!-- Strict Mode -->
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="strictMode">
        <label class="form-check-label" for="strictMode">Strict Mode</label>
      </div>

      <!-- Difficulty -->
      <div class="mb-3">
        <label for="difficulty" class="form-label">Difficulty:</label>
        <select id="difficulty" class="form-select w-50 mx-auto">
          <option value="1000">Easy</option>
          <option value="700">Medium</option>
          <option value="400">Hard</option>
        </select>
      </div>

      <!-- Game Buttons -->
      <div class="row justify-content-center mt-4">
        <div class="col-6 col-md-3">
          <div class="btn color-btn green" id="green"></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="btn color-btn red" id="red"></div>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-6 col-md-3">
          <div class="btn color-btn yellow" id="yellow"></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="btn color-btn blue" id="blue"></div>
        </div>
      </div>

      <!-- Scores -->
      <div class="mt-4">
        <p>Score: <span id="score">0</span> | High Score: <span id="high-score">0</span></p>
      </div>
    </div>
  </div>

  <!-- Sounds -->
  <audio id="green-sound" src="sounds/green.mp3"></audio>
  <audio id="red-sound" src="sounds/red.mp3"></audio>
  <audio id="yellow-sound" src="sounds/yellow.mp3"></audio>
  <audio id="blue-sound" src="sounds/blue.mp3"></audio>
  <audio id="wrong-sound" src="sounds/wrong.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
